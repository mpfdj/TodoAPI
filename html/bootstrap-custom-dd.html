<!DOCTYPE html>
<html>
<head>
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons CSS - ADD THIS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css" rel="stylesheet">
</head>
<body>
<!-- Your HTML here -->
<select name="status" class="selectpicker" style="width: auto;">
    <option value="todo" th:selected="${task.status == 'todo'}" data-icon="bi-clipboard">Todo</option>
    <option value="in_progress" th:selected="${task.status == 'in_progress'}" data-icon="bi-hourglass-split">In Progress</option>
    <option value="done" th:selected="${task.status == 'done'}" data-icon="bi-check-circle">Done</option>
    <option value="archived" th:selected="${task.status == 'archived'}" data-icon="bi-archive">Archived</option>
</select>


<!-- JavaScript - IMPORTANT: Load in this order -->
<!-- 1. jQuery FIRST -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- 2. Bootstrap JS SECOND -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- 3. Bootstrap Select THIRD -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>

<script>
    $(document).ready(function() {
        $('.selectpicker').selectpicker();
    });
</script>
</body>
</html>
