<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center min-vh-100 align-items-center">
        <div class="col-md-5 col-lg-4">

            <div class="text-center mb-4">
                <h1 class="display-4 text-primary fw-bold">Todo App</h1>
                <p class="text-secondary">Sign in to manage your tasks</p>
            </div>

            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h2 class="h5 mb-0">Login</h2>
                </div>
                <div class="card-body p-4">

                    <!-- Error Message -->
                    <div th:if="${error}" class="alert alert-danger py-2" role="alert">
                        <strong>Error!</strong> Invalid email or password.
                    </div>

                    <!-- Success Message - Logout -->
                    <div th:if="${logout}" class="alert alert-info py-2" role="alert">
                        <strong>Success!</strong> You have been logged out.
                    </div>

                    <!-- Success Message - Registration -->
                    <div th:if="${registered}" class="alert alert-success py-2" role="alert">
                        <strong>Success!</strong> Registration successful! Please login.
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/login}" method="post">
<!--                        <div class="mb-3">-->
<!--                            <label for="email" class="form-label">Email address</label>-->
<!--                            <input type="email"-->
<!--                                   class="form-control"-->
<!--                                   id="email"-->
<!--                                   name="email"-->
<!--                                   placeholder="Enter your email"-->
<!--                                   required autofocus>-->
<!--                        </div>-->


                        <div class="mb-3">
                            <input type="email"
                                   class="form-control"
                                   id="username"
                                   name="username"
                                   placeholder="Enter your email"
                                   required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="Enter your password"
                                   required>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                            <label class="form-check-label" for="remember-me">Remember me</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            Sign In
                        </button>

                        <hr>

                        <div class="text-center">
                            <span class="text-secondary">Don't have an account?</span>
                            <a th:href="@{/register}" class="text-decoration-none ms-1">Create account</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
