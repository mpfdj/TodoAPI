<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tasks</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Bootstrap Select CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta3/css/bootstrap-select.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/custom.css}" />

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- CSRF Meta Tags -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
        .handleDragAndDrop {
            cursor: grab;
        }
        .handleDragAndDrop:active {
            cursor: grabbing;
        }
        /* Add visual feedback for debugging */
        .handleDragAndDrop.dragging {
            background-color: #ffcccc;
        }
    </style>
</head>
<body class="container py-4">

<!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="display-5 fw-bold text-primary">
        Tasks for List: <span th:text="${listName}" class="text-secondary"></span>
    </h1>

    <a th:href="@{/ui/users/{userId}/lists(userId=${userId})}" class="btn btn-outline-secondary">
        ← Back to Lists
    </a>
</div>

<hr class="my-4">

<!-- Create Task Form -->
<div class="card mb-4 shadow-sm">
    <div class="card-header bg-primary text-white">
        <h2 class="h5 mb-0">Add New Task</h2>
    </div>
    <div class="card-body">
        <form th:action="@{/ui/users/{userId}/lists/{listId}/tasks(userId=${userId}, listId=${listId})}"
              method="post"
              class="row g-3">

            <div class="col-md-4">
                <label for="title" class="form-label">Task title</label>
                <input type="text"
                       class="form-control"
                       id="title"
                       name="title"
                       placeholder="Enter task title"
                       required />
            </div>

            <div class="col-md-4">
                <label for="description" class="form-label">Description</label>
                <input type="text"
                       class="form-control"
                       id="description"
                       name="description"
                       placeholder="Description (optional)" />
            </div>

            <div class="col-md-2">
                <label for="dueDate" class="form-label">Due Date</label>
                <input type="date"
                       class="form-control"
                       id="dueDate"
                       name="dueDate"
                       required
                       th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" />
            </div>

            <div class="col-md-1">
                <label for="priority" class="form-label">Priority</label>
                <select class="form-select" id="priority" name="priority" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <div class="col-md-1 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">
                    Add Task
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Tasks Container -->
<div th:id="task-container-wrapper"
     th:data-user-id="${userId}"
     th:data-list-id="${listId}">
    <div th:replace="~{fragments/tasks-container :: tasks-container(tasks=${tasks}, userId=${userId}, listId=${listId})}"></div>
</div>

<!-- DEBUG -->
<div th:replace="~{fragments/debug :: debug}"></div>

<!-- ============================================ -->
<!-- SCRIPTS - Load in correct order              -->
<!-- ============================================ -->

<!-- 1. jQuery FIRST -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- 2. Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- 3. Bootstrap Select JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta3/js/bootstrap-select.min.js"></script>

<script>

    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';




// ============================================
// BOOTSTRAP SELECT INITIALIZATION
// ============================================
function initBootstrapSelects() {
    if (typeof $ === 'undefined' || !$.fn.selectpicker) {
        console.warn('jQuery or Bootstrap Select not available');
        return;
    }

    $('select.selectpicker').each(function() {
        const $select = $(this);
        if (!$select.data('selectpicker')) {
            try {
                $select.selectpicker({
                    iconBase: 'bi',
                    tickIcon: 'bi-check',
                    liveSearch: false,
                    size: 5,
                    style: 'btn-sm btn-outline-secondary'
                });
            } catch (e) {
                console.error('Error initializing select:', e);
            }
        }
    });
}

// ============================================
// STATUS CHANGE HANDLER
// ============================================
function handleStatusChange(selectElement, taskId) {
    const newStatus = selectElement.value;
<!--    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;-->
<!--    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';-->

    const taskContainer = document.getElementById('task-container-wrapper');
    const userId = taskContainer?.dataset?.userId;
    const listId = taskContainer?.dataset?.listId;

    if (!userId || !listId) {
        console.error('Could not find userId or listId');
        return;
    }

    const headers = {
        'Content-Type': 'application/json',
    };
    if (csrfToken) {
        headers[csrfHeader] = csrfToken;
    }

    fetch(`/ui/users/${userId}/lists/${listId}/tasks/${taskId}/status`, {
        method: 'PUT',
        headers: headers,
        body: JSON.stringify({ status: newStatus })
    })
    .then(response => {
        if (!response.ok) throw new Error('Failed to update status');
        return response.json();
    })
    .then(() => {
        // Update title styling
        const titleContainer = document.getElementById('title-container-' + taskId);
        if (titleContainer) {
            const titleSpan = titleContainer.querySelector('span');
            if (titleSpan) {
                titleSpan.className = newStatus === 'archived'
                    ? 'text-secondary text-decoration-line-through fw-bold'
                    : 'fw-bold';
            }
        }

        // Update the select value in Bootstrap Select
        $(selectElement).selectpicker('val', newStatus);
        $(selectElement).selectpicker('refresh');
        $(selectElement).selectpicker('render');
    })
    .catch(error => {
        console.error('Error:', error);
        // Revert on error
        const originalValue = selectElement.getAttribute('data-original-value') || 'todo';
        $(selectElement).selectpicker('val', originalValue);
        showAlert('Failed to update task status. Please try again.', 'danger');
    });
}

function showAlert(message, type = 'info') {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
    alertDiv.role = 'alert';
    alertDiv.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    `;
    document.querySelector('.container').prepend(alertDiv);
    setTimeout(() => alertDiv.remove(), 5000);
}

// ============================================
// HTMX EVENT LISTENERS
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    // Initialize Bootstrap Selects after a delay
    setTimeout(initBootstrapSelects, 200);
});

// Reinitialize after HTMX swaps
document.body.addEventListener('htmx:afterSwap', function(event) {
    if (event.detail.target) {
        setTimeout(initBootstrapSelects, 300);
    }
});

document.body.addEventListener('htmx:afterSettle', function(event) {
    if (event.detail.target) {
        setTimeout(initBootstrapSelects, 200);
    }
});

<!--        const csrfHeader = getCSRFHeader();-->
<!--        if (csrfToken) {-->
<!--            headers[csrfHeader] = csrfToken;-->
<!--        }-->





        // HTMX call to update sort order
        fetch(`/ui/users/${userId}/lists/${listId}/tasks/sort`, {

        })
        .then(response => {

            return response.text();

        .then(html => {
            // Replace the tasks container with updated content
            document.getElementById('tasks-container').outerHTML = html;
            // Re-initialize drag functionality
            initializeTableDragger();
        })
        .catch(error => {
            console.error('Error updating sort order:', error);
            // Show error message to user
            showAlert('Failed to update task order. Please try again.', 'danger');
        });

    });

    // Also move the task-edit-row table row
    dragger.on('drop', function() {
        document.querySelectorAll('tr[id^="task-"]').forEach(taskRow => {
            if (taskRow.id.startsWith('task-edit-row-')) return;
            const taskId = taskRow.id.replace('task-', '');
            const editRow = document.getElementById('task-edit-row-' + taskId);
            if (editRow) {
                taskRow.after(editRow);
            }
        });
    });

}


document.addEventListener('DOMContentLoaded', function() {
    initializeTableDragger();
});

document.body.addEventListener('htmx:afterSettle', function(event) {
    if (event.detail.target && event.detail.target.id === 'tasks-container') {
        initializeTableDragger();
    }
});

console.log('Tasks page loaded successfully!');
</script>
<script th:src="@{/js/table-dragger.min.js}"></script>
</body>
</html>
