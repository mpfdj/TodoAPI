<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tasks</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS (alleen voor specifieke overschrijvingen) -->
    <link rel="stylesheet" th:href="@{/css/custom.css}" />

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- CSRF Meta Tags -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
        .handleDragAndDrop {
            cursor: grab;
        }
        .handleDragAndDrop:active {
            cursor: grabbing;
        }
        /* Add visual feedback for debugging */
        .handleDragAndDrop.dragging {
            background-color: #ffcccc;
        }
    </style>
</head>
<body class="container py-4">

<!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="display-5 fw-bold text-primary">
        Tasks for List: <span th:text="${listName}" class="text-secondary"></span>
    </h1>

    <!-- Back to Lists -->
    <a th:href="@{/ui/users/{userId}/lists(userId=${userId})}" class="btn btn-outline-secondary">
        ← Back to Lists
    </a>
</div>

<hr class="my-4">

<!-- Create Task Form -->
<div class="card mb-4 shadow-sm">
    <div class="card-header bg-primary text-white">
        <h2 class="h5 mb-0">Add New Task</h2>
    </div>
    <div class="card-body">
        <form th:action="@{/ui/users/{userId}/lists/{listId}/tasks(userId=${userId}, listId=${listId})}"
              method="post"
              class="row g-3">

            <div class="col-md-4">
                <label for="title" class="form-label">Task title</label>
                <input type="text"
                       class="form-control"
                       id="title"
                       name="title"
                       placeholder="Enter task title"
                       required />
            </div>

            <div class="col-md-4">
                <label for="description" class="form-label">Description</label>
                <input type="text"
                       class="form-control"
                       id="description"
                       name="description"
                       placeholder="Description (optional)" />
            </div>

            <div class="col-md-2">
                <label for="dueDate" class="form-label">Due Date</label>
                <input type="date"
                       class="form-control"
                       id="dueDate"
                       name="dueDate"
                       required
                       th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" />
            </div>

            <div class="col-md-1">
                <label for="priority" class="form-label">Priority</label>
                <select class="form-select" id="priority" name="priority" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <div class="col-md-1 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">
                    Add Task
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Tasks Container -->
<div th:id="task-container-wrapper"
     th:data-user-id="${userId}"
     th:data-list-id="${listId}">
    <div th:replace="~{fragments/tasks-container :: tasks-container(tasks=${tasks}, userId=${userId}, listId=${listId})}"></div>
</div>

<!-- DEBUG -->
<div th:replace="~{fragments/debug :: debug}"></div>

<!-- Bootstrap JavaScript Bundle (voor interactieve componenten) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    // CSRF helper functions
    function getCSRFToken() {
        const metaTag = document.querySelector('meta[name="_csrf"]');
        return metaTag ? metaTag.content : null;
    }

    function getCSRFHeader() {
        const metaTag = document.querySelector('meta[name="_csrf_header"]');
        return metaTag ? metaTag.content : 'X-CSRF-TOKEN';
    }

    // Add helper function for showing alerts
    function showAlert(message, type = 'info') {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
        alertDiv.role = 'alert';
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        `;
        document.querySelector('.container').prepend(alertDiv);
        setTimeout(() => alertDiv.remove(), 5000);
    }

    let dragger = null;

    function initializeTableDragger() {
        const el = document.getElementById('tasksTable');

        if (!el) return;

        const TableDragger = tableDragger.default || tableDragger;

        dragger = TableDragger(el, {
            mode: 'row',
            dragHandler: '.handleDragAndDrop',
            onlyBody: true,
            animation: 300
        });

        // dragger.on('drop', (...args) => {
        //     console.log(args);
        // });

        dragger.on('drop', function(from, to) {

            const taskRows = Array.from(
                document.querySelectorAll(
                    '#tasksTable tbody tr[id^="task-"]:not([id^="task-edit-row-"])'
                )
            );

            const sortOrder = taskRows.map((row, index) => ({
                taskId: row.id.replace('task-', ''),
                sortOrder: index + 1
            }));


            // Call sortOrder endpoint here...
            console.log(sortOrder);


    const taskContainerData = document.getElementById('task-container-wrapper');
    const userId = taskContainerData.dataset.userId;
    const listId = taskContainerData.dataset.listId;
    console.log('userId:' + userId);
    console.log('listId:' + listId);


            // Prepare headers with CSRF token
            const headers = {
                'Content-Type': 'application/json',
            };

            // Add CSRF token if available
            const csrfToken = getCSRFToken();
            const csrfHeader = getCSRFHeader();
            if (csrfToken) {
                headers[csrfHeader] = csrfToken;
            }





            // HTMX call to update sort order
            fetch(`/ui/users/${userId}/lists/${listId}/tasks/sort`, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(sortOrder)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.text();
            })
            .then(html => {
                // Replace the tasks container with updated content
                document.getElementById('tasks-container').outerHTML = html;
                // Re-initialize drag functionality
                initializeTableDragger();
            })
            .catch(error => {
                console.error('Error updating sort order:', error);
                // Show error message to user
                showAlert('Failed to update task order. Please try again.', 'danger');
            });

        });

        // Also move the task-edit-row table row
        dragger.on('drop', function() {
            document.querySelectorAll('tr[id^="task-"]').forEach(taskRow => {
                if (taskRow.id.startsWith('task-edit-row-')) return;
                const taskId = taskRow.id.replace('task-', '');
                const editRow = document.getElementById('task-edit-row-' + taskId);
                if (editRow) {
                    taskRow.after(editRow);
                }
            });
        });

    }


    document.addEventListener('DOMContentLoaded', function() {
        initializeTableDragger();
    });

    document.body.addEventListener('htmx:afterSettle', function(event) {
        if (event.detail.target && event.detail.target.id === 'tasks-container') {
            initializeTableDragger();
        }
    });

</script>
<script th:src="@{/js/table-dragger.min.js}"></script>
</body>
</html>
