<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tasks</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 10px 0; padding: 10px; background-color: #f5f5f5; border-radius: 5px; }
        button { margin-left: 10px; }
        a { margin-right: 10px; text-decoration: none; color: #0066cc; }
        a:hover { text-decoration: underline; }
        .task-info { display: inline-block; flex: 1; }
        .task-name { font-weight: bold; }
        .task-description { color: #666; font-size: 0.9em; margin-left: 10px; }
        .task-completed { text-decoration: line-through; color: #888; }
        .archived-badge {
            display: inline-block;
            background-color: #D1CAC9;
            color: #333;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 10px;
        }
        .done-badge {
            display: inline-block;
            background-color: #09851E;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 10px;
        }
        .in_progress-badge {
            display: inline-block;
            background-color: #0D5AE0;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 10px;
        }
        .todo-badge {
            display: inline-block;
            background-color: #0DE042;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        hr { margin: 20px 0; }
        input[type="text"], textarea {
            padding: 5px;
            margin-right: 10px;
            width: 200px;
        }
        textarea {
            width: 300px;
            vertical-align: middle;
        }
        form { display: inline-block; margin-right: 10px; }
        .delete-form { display: inline; }
        .edit-form { display: inline; }
        .back-link { margin-bottom: 20px; display: inline-block; }
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .task-actions {
            display: inline-block;
        }
        .checkbox-label {
            display: inline-flex;
            align-items: center;
            margin-right: 10px;
            cursor: pointer;
        }
        .checkbox-label input {
            margin-right: 5px;
        }
    </style>
</head>
<body>

<h1>Tasks for List: <span th:text="${listName}">List Name</span></h1>

<!-- Navigation -->
<p>
    <a th:href="@{'/ui/users/' + ${userId} + '/lists'}" class="back-link">← Back to Lists</a>
</p>

<hr/>

<!-- Create Task Form -->
<h2>Add New Task</h2>
<form th:action="@{'/ui/users/' + ${userId} + '/lists/' + ${listId} + '/tasks'}" method="post">
    <input type="text" name="title" placeholder="Enter task title" required />
    <input type="text" name="description" placeholder="Description (optional)" />
    <button type="submit">Add Task</button>
</form>

<hr/>

<!-- Task List -->
<h2>All Tasks</h2>
<ul>
    <li th:each="task : ${tasks}">
        <div class="task-item">
            <div class="task-info">
                <!-- Toggle Complete Checkbox -->
                <label class="checkbox-label">
                    <form th:action="@{'/ui/users/' + ${userId} + '/lists/' + ${listId} + '/tasks/' + ${task.id} + '/toggle'}"
                          method="post"
                          style="display: inline;">
                        <input type="hidden" name="_method" value="PUT" />
                        <input type="checkbox"
                               th:checked="${task.status == 'done' }"
                               onchange="this.form.submit()" />
                    </form>
                </label>

                <!-- Task Title -->
                <span class="task-name" th:text="${task.title}">Task Title</span>

                <!-- Task Description -->
                <span th:if="${task.description != null and task.description != ''}"
                      class="task-description"
                      th:text="'- ' + ${task.description}">- Description</span>


                archived
                done
                in_progress
                todo

                <!-- Status Badge -->
                <span th:if="${task.status == 'archived' }" class="archived-badge">Archived</span>
                <span th:if="${task.status == 'done' }" class="done-badge">Done</span>
                <span th:if="${task.status == 'in_progress' }" class="in_progress-badge">In progress</span>
                <span th:if="${task.status == 'todo' }" class="todo-badge">Todo</span>
            </div>

            <div class="task-actions">
                <!-- Edit Task -->
                <a th:href="@{'/ui/users/' + ${userId} + '/lists/' + ${listId} + '/tasks/' + ${task.id} + '/edit'}">Edit</a>

                <!-- Delete Task -->
                <form class="delete-form" th:action="@{'/ui/users/' + ${userId} + '/lists/' + ${listId} + '/tasks/' + ${task.id}}"
                      method="post"
                      style="display: inline;">
                    <input type="hidden" name="_method" value="DELETE" />
                    <button type="submit" onclick="return confirm('Delete this task?')">Delete</button>
                </form>
            </div>
        </div>
    </li>
</ul>

<!-- Message when no tasks exist -->
<div th:if="${tasks.empty}" style="color: #666; font-style: italic; margin-top: 20px;">
    No tasks yet. Create your first task above!
</div>

<hr/>

</body>
</html>
