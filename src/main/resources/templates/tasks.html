<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tasks</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}" />  <!-- In users.html, lists.html, tasks.html, etc. -->
    <link rel="stylesheet" href="/static/css/style.css" />        <!-- or for static HTML -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>

<!-- DEBUG -->
<div th:replace="~{fragments/debug :: debug}"></div>

<h1>Tasks for List: <span th:text="${listName}" /></h1>

<p>
    <a th:href="@{/ui/users/{userId}/lists(userId=${userId})}" class="back-link">← Back to Lists</a>
</p>

<hr/>

<!-- Create Task Form -->
<h2>Add New Task</h2>
<form th:action="@{/ui/users/{userId}/lists/{listId}/tasks(userId=${userId}, listId=${listId})}" method="post">
    <input type="text" name="title" placeholder="Enter task title" required />
    <input type="text" name="description" placeholder="Description (optional)" />
    <input type="date" name="dueDate" required th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" />
    <select name="priority" required>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
    </select>
    <button type="submit">Add Task</button>
</form>

<hr/>

<!-- Tasks Container - This will be replaced on delete -->
<div th:replace="~{fragments/tasks-container :: tasks-container(tasks=${tasks}, userId=${userId}, listId=${listId})}"></div>
</body>
</html>
