<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tasks</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Bootstrap Select CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta3/css/bootstrap-select.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/custom.css}" />

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- CSRF Meta Tags -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
        .handleDragAndDrop { cursor: grab; }
        .handleDragAndDrop:active { cursor: grabbing; }
        .handleDragAndDrop.dragging { background-color: #ffcccc; }
    </style>
</head>
<body class="container py-4">

<!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="display-5 fw-bold text-primary">
        Tasks for List: <span th:text="${listName}" class="text-secondary"></span>
    </h1>
    <a th:href="@{/ui/users/{userId}/lists(userId=${userId})}" class="btn btn-outline-secondary">
        ← Back to Lists
    </a>
</div>

<hr class="my-4">

<!-- Create Task Form -->
<div class="card mb-4 shadow-sm">
    <div class="card-header bg-primary text-white">
        <h2 class="h5 mb-0">Add New Task</h2>
    </div>
    <div class="card-body">
        <form th:action="@{/ui/users/{userId}/lists/{listId}/tasks(userId=${userId}, listId=${listId})}"
              method="post"
              class="row g-3">
            <div class="col-md-4">
                <label for="title" class="form-label">Task title</label>
                <input type="text" class="form-control" id="title" name="title"
                       placeholder="Enter task title" required />
            </div>
            <div class="col-md-4">
                <label for="description" class="form-label">Description</label>
                <input type="text" class="form-control" id="description" name="description"
                       placeholder="Description (optional)" />
            </div>
            <div class="col-md-2">
                <label for="dueDate" class="form-label">Due Date</label>
                <input type="date" class="form-control" id="dueDate" name="dueDate" required
                       th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" />
            </div>
            <div class="col-md-1">
                <label for="priority" class="form-label">Priority</label>
                <select class="form-select" id="priority" name="priority" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">Add Task</button>
            </div>
        </form>
    </div>
</div>

<!-- Tasks Container -->
<div th:id="task-container-wrapper"
     th:data-user-id="${userId}"
     th:data-list-id="${listId}">
    <div th:replace="~{fragments/tasks-container :: tasks-container(tasks=${tasks}, userId=${userId}, listId=${listId})}"></div>
</div>

<!-- DEBUG -->
<div th:replace="~{fragments/debug :: debug}"></div>

<!-- ============================================ -->
<!-- SCRIPTS -->
<!-- ============================================ -->

<!-- 1. jQuery FIRST -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- 2. Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- 3. Bootstrap Select JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta3/js/bootstrap-select.min.js"></script>

<script>
// ============================================
// GLOBAL CONFIG
// ============================================
const CSRF = {
    token: document.querySelector('meta[name="_csrf"]')?.content,
    header: document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN'
};

const TaskContainer = {
    get wrapper() { return document.getElementById('task-container-wrapper'); },
    get userId() { return this.wrapper?.dataset?.userId; },
    get listId() { return this.wrapper?.dataset?.listId; },
    get table() { return document.getElementById('tasksTable'); }
};

// ============================================
// UTILITY FUNCTIONS
// ============================================
const Utils = {
    // Create and show alert
    showAlert(message, type = 'info', duration = 5000) {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
        alertDiv.role = 'alert';
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        `;
        document.querySelector('.container').prepend(alertDiv);
        setTimeout(() => alertDiv.remove(), duration);
    },

    // Build fetch headers with CSRF
    getHeaders(contentType = 'application/json') {
        const headers = { 'Content-Type': contentType };
        if (CSRF.token) headers[CSRF.header] = CSRF.token;
        return headers;
    },

    // Debounce function
    debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }
};

// ============================================
// BOOTSTRAP SELECT MANAGER
// ============================================
const SelectManager = {
    // Status color classes mapping
    statusClasses: {
        todo: 'status-todo',
        in_progress: 'status-in_progress',
        done: 'status-done',
        archived: 'status-archived'
    },

    // Initialize a single selectpicker
    initSelect(selectElement) {
        if (!selectElement || typeof $ === 'undefined') return;
        
        const $select = $(selectElement);
        
        // Destroy existing instance if present
        if ($select.data('selectpicker')) {
            $select.selectpicker('destroy');
        }

        // Initialize with options
        $select.selectpicker({
            style: 'btn-light',
            size: false,
            liveSearch: false
        });

        // Fix button classes
        const $button = $select.closest('.bootstrap-select').find('.dropdown-toggle');
        $button.removeClass();
        $button.addClass('btn dropdown-toggle btn-sm btn-outline-secondary');

        // Sync status class
        this.syncStatusClass(selectElement);

        // Add change event listener for HTMX
        $select.on('changed.bs.select', (e, clickedIndex, newValue) => {
            console.log('Status changed to:', newValue);
            $select.trigger('change'); // Trigger for HTMX
            this.syncStatusClass(selectElement);
        });
    },

    // Sync status class from select value to button
    syncStatusClass(selectElement) {
        if (!selectElement) return;
        const status = selectElement.value;
        const $button = $(selectElement).closest('.bootstrap-select').find('.dropdown-toggle');
        $button.removeClass('status-todo status-in_progress status-done status-archived');
        if (status && this.statusClasses[status]) {
            $button.addClass(this.statusClasses[status]);
        }
    },

    // Initialize all selectpickers in a container
    initAll(container = document) {
        if (typeof $ === 'undefined' || !$.fn.selectpicker) return;
        $(container).find('select.selectpicker.status-select').each((i, el) => this.initSelect(el));
    }
};

// ============================================
// STATUS UPDATE HANDLER
// ============================================
function handleStatusUpdate(selectElement, taskId) {
    const newStatus = selectElement.value;
    const userId = TaskContainer.userId;
    const listId = TaskContainer.listId;

    if (!userId || !listId) {
        console.error('Missing userId or listId');
        return;
    }

    fetch(`/ui/users/${userId}/lists/${listId}/tasks/${taskId}/status`, {
        method: 'PUT',
        headers: Utils.getHeaders(),
        body: JSON.stringify({ status: newStatus })
    })
    .then(response => {
        if (!response.ok) throw new Error('Failed to update status');
        return response.json();
    })
    .then(() => {
        // Update title styling
        const titleContainer = document.getElementById(`title-container-${taskId}`);
        if (titleContainer) {
            const titleSpan = titleContainer.querySelector('span');
            if (titleSpan) {
                titleSpan.className = newStatus === 'archived'
                    ? 'text-secondary text-decoration-line-through fw-bold'
                    : 'fw-bold';
            }
        }
        // Update Bootstrap Select value
        $(selectElement).selectpicker('val', newStatus);
        $(selectElement).selectpicker('refresh');
    })
    .catch(error => {
        console.error('Error updating status:', error);
        const originalValue = selectElement.getAttribute('data-original-value') || 'todo';
        $(selectElement).selectpicker('val', originalValue);
        Utils.showAlert('Failed to update task status. Please try again.', 'danger');
    });
}

// ============================================
// DRAG AND DROP MANAGER
// ============================================
let dragger = null;

const DragManager = {
    init() {
        const el = TaskContainer.table;
        if (!el) return;

        const TableDragger = tableDragger.default || tableDragger;
        dragger = TableDragger(el, {
            mode: 'row',
            dragHandler: '.handleDragAndDrop',
            onlyBody: true,
            animation: 300
        });

        this.setupDropHandlers();
    },

    setupDropHandlers() {
        if (!dragger) return;

        dragger.on('drop', (from, to) => {
            const taskRows = Array.from(
                document.querySelectorAll('#tasksTable tbody tr[id^="task-"]:not([id^="task-edit-row-"])')
            );

            const sortOrder = taskRows.map((row, index) => ({
                taskId: row.id.replace('task-', ''),
                sortOrder: index + 1
            }));

            console.log('New sort order:', sortOrder);

            const userId = TaskContainer.userId;
            const listId = TaskContainer.listId;

            fetch(`/ui/users/${userId}/lists/${listId}/tasks/sort`, {
                method: 'POST',
                headers: Utils.getHeaders(),
                body: JSON.stringify(sortOrder)
            })
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.text();
            })
            .then(html => {
                const container = document.getElementById('tasks-container');
                container.outerHTML = html;
                
                const newContainer = document.getElementById('tasks-container');
                if (newContainer && typeof htmx !== 'undefined') {
                    htmx.process(newContainer);
                }
                
                this.init(); // Re-initialize drag
                SelectManager.initAll(); // Re-initialize selects
            })
            .catch(error => {
                console.error('Error updating sort order:', error);
                Utils.showAlert('Failed to update task order. Please try again.', 'danger');
            });
        });

        // Keep edit rows with their task rows
        dragger.on('drop', () => {
            document.querySelectorAll('tr[id^="task-"]').forEach(taskRow => {
                if (taskRow.id.startsWith('task-edit-row-')) return;
                const taskId = taskRow.id.replace('task-', '');
                const editRow = document.getElementById(`task-edit-row-${taskId}`);
                if (editRow) taskRow.after(editRow);
            });
        });
    }
};

// ============================================
// HTMX EVENT HANDLERS
// ============================================
const HTMXHandlers = {
    init() {
        // After swap - reinitialize selects
        document.body.addEventListener('htmx:afterSwap', (event) => {
            if (event.detail.target) {
                setTimeout(() => SelectManager.initAll(event.detail.target), 100);
            }
        });

        // After settle - reinitialize selects
        document.body.addEventListener('htmx:afterSettle', (event) => {
            if (event.detail.target) {
                setTimeout(() => SelectManager.initAll(event.detail.target), 100);
                if (event.detail.target.id === 'tasks-container') {
                    DragManager.init();
                }
            }
        });
    }
};

// ============================================
// INITIALIZATION
// ============================================
document.addEventListener('DOMContentLoaded', () => {
    // Initialize all components
    SelectManager.initAll();
    DragManager.init();
    HTMXHandlers.init();
    
    console.log('Tasks page initialized');
});

console.log('Tasks page loaded');
</script>
<script th:src="@{/js/table-dragger.min.js}"></script>
</body>
</html>
