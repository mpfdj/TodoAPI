<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="debug" class="alert alert-info alert-dismissible fade show mb-4 shadow-sm" role="alert" style="background-color: #e8f4f8; border-left: 4px solid #2196F3;">

    <div class="d-flex align-items-center mb-2">
        <strong class="me-2">📋 All Model Attributes:</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="small">
        <div th:each="variable : ${#ctx.getVariableNames()}">
            <div th:if="${!variable.startsWith('org.springframework') and
                          !variable.startsWith('spring') and
                          !variable.startsWith('thymeleaf') and
                          !variable.contains('FILTERED')
                         }"
                 class="py-1 border-bottom border-info border-opacity-25">
                <span class="text-primary fw-mono" th:text="'• ' + ${variable} + ':'"></span>
                <span class="text-secondary ms-2 font-monospace small" th:text="${#ctx.getVariable(variable)}"></span>
            </div>
        </div>
    </div>

    <!-- Optional: Collapse button for large debug info -->
    <div class="mt-2 text-center">
        <small>
            <a href="#" class="text-decoration-none" onclick="this.closest('.alert').querySelector('.debug-content').classList.toggle('d-none'); return false;">
                Toggle details
            </a>
        </small>
    </div>

</div>

<!-- Bootstrap JS (voor dismiss functionaliteit) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
