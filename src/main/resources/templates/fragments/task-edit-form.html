<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>  <!-- In users.html, lists.html, tasks.html, etc. -->
    <link rel="stylesheet" href="/static/css/style.css"/> <!-- or for static HTML -->
</head>
<div th:fragment="task-edit-form(task, userId, listId)">

    <form th:hx-put="@{/ui/users/{userId}/lists/{listId}/tasks/{taskId}(userId=${userId}, listId=${listId}, taskId=${task.id}, fragment='task-item')}"
          th:hx-target="'#task-' + ${task.id}"
          th:hx-swap="outerHTML">

        <div class="task-edit-form-row" style="margin-top: 20px;">
            <label>Title:</label>
            <input type="text" name="title" th:value="${task.title}" required/>
        </div>

        <div class="task-edit-form-row">
            <label>Description:</label>
            <textarea name="description" rows="2" th:text="${task.description}"></textarea>
        </div>

        <div class="task-edit-form-row">
            <label>Status:</label>
            <select name="status" required>
                <option value="todo" th:selected="${task.status == 'todo'}">Todo</option>
                <option value="in_progress" th:selected="${task.status == 'in_progress'}">In Progress</option>
                <option value="done" th:selected="${task.status == 'done'}">Done</option>
                <option value="archived" th:selected="${task.status == 'archived'}">Archived</option>
            </select>
        </div>

        <div class="task-edit-form-row">
            <label>Due Date:</label>
            <input type="date" name="dueDate" th:value="${#temporals.format(task.dueDate, 'yyyy-MM-dd')}"/>
        </div>

        <div class="task-edit-form-row">
            <label>Priority:</label>
            <select name="priority" required>
                <option value="1" th:selected="${task.priority == 1}">1 (Lowest)</option>
                <option value="2" th:selected="${task.priority == 2}">2</option>
                <option value="3" th:selected="${task.priority == 3}">3</option>
                <option value="4" th:selected="${task.priority == 4}">4</option>
                <option value="5" th:selected="${task.priority == 5}">5 (Highest)</option>
            </select>
        </div>

        <div class="task-edit-form-row" style="display: flex; justify-content: flex-end;">
            <button type="submit"
                    th:hx-confirm="'Save changes?'">
                Save
            </button>

            <button type="button"
                    th:hx-get="@{/ui/empty}"
                    th:hx-target="'#task-edit-container-' + ${task.id}"
                    th:hx-swap="innerHTML"
                    th:hx-trigger="click">
                Cancel
            </button>
        </div>

    </form>
</div>
</html>
