<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<div th:fragment="task-edit-form(task, userId, listId)">

    <form th:hx-put="@{/ui/users/{userId}/lists/{listId}/tasks/{taskId}(userId=${userId}, listId=${listId}, taskId=${task.id}, fragment='task-item')}"
          th:hx-target="'#task-' + ${task.id}"
          th:hx-swap="outerHTML"
          class="needs-validation">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- Debug: Toon CSRF waarden -->
        <!--                    <div style="background: #f0f0f0; padding: 10px; margin: 10px;">-->
        <!--                        <h3>CSRF Debug Info:</h3>-->
        <!--                        <p>Parameter Name: <strong th:text="${_csrf.parameterName}"></strong></p>-->
        <!--                        <p>Token: <strong th:text="${_csrf.token}"></strong></p>-->
        <!--                        <p>Header Name: <strong th:text="${_csrf.headerName}"></strong></p>-->
        <!--                    </div>-->

        <div class="card border-0 bg-light">
            <div class="card-body p-3">

                <!-- Title -->
                <div class="row mb-3 align-items-center">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold mb-0">Title:</label>
                    </div>
                    <div class="col-md-9">
                        <input type="text"
                               class="form-control form-control-sm"
                               name="title"
                               th:value="${task.title}"
                               required />
                    </div>
                </div>

                <!-- Description -->
                <div class="row mb-3 align-items-start">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold mb-0">Description:</label>
                    </div>
                    <div class="col-md-9">
                        <textarea name="description"
                                  class="form-control form-control-sm"
                                  rows="2"
                                  th:text="${task.description}"></textarea>
                    </div>
                </div>

                <!-- Status -->
                <div class="row mb-3 align-items-center">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold mb-0">Status:</label>
                    </div>
                    <div class="col-md-9">
                        <select name="status" class="form-select form-select-sm" required>
                            <option value="todo" th:selected="${task.status == 'todo'}">Todo</option>
                            <option value="in_progress" th:selected="${task.status == 'in_progress'}">In Progress</option>
                            <option value="done" th:selected="${task.status == 'done'}">Done</option>
                            <option value="archived" th:selected="${task.status == 'archived'}">Archived</option>
                        </select>
                    </div>
                </div>

                <!-- Due Date -->
                <div class="row mb-3 align-items-center">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold mb-0">Due Date:</label>
                    </div>
                    <div class="col-md-9">
                        <input type="date"
                               class="form-control form-control-sm"
                               name="dueDate"
                               th:value="${#temporals.format(task.dueDate, 'yyyy-MM-dd')}" />
                    </div>
                </div>

                <!-- Priority -->
                <div class="row mb-4 align-items-center">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold mb-0">Priority:</label>
                    </div>
                    <div class="col-md-9">
                        <select name="priority" class="form-select form-select-sm" required>
                            <option value="1" th:selected="${task.priority == 1}">1 (Lowest)</option>
                            <option value="2" th:selected="${task.priority == 2}">2</option>
                            <option value="3" th:selected="${task.priority == 3}">3</option>
                            <option value="4" th:selected="${task.priority == 4}">4</option>
                            <option value="5" th:selected="${task.priority == 5}">5 (Highest)</option>
                        </select>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="row">
                    <div class="col-md-9 offset-md-3">
                        <div class="d-flex gap-2">
                            <button type="submit"
                                    class="btn btn-primary btn-sm"
                                    th:hx-confirm="'Save changes?'">
                                💾 Save
                            </button>
                            <button type="button"
                                    class="btn btn-secondary btn-sm"
                                    th:hx-get="@{/ui/empty}"
                                    th:attr="hx-target='#task-edit-container-' + ${task.id}"
                                    th:hx-swap="innerHTML"
                                    th:hx-trigger="click">
                                ❌ Cancel
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </form>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
