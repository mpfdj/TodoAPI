<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Bootstrap Select CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta3/css/bootstrap-select.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>

    <style>
        .bootstrap-select .dropdown-toggle .filter-option-inner-inner i,
        .bootstrap-select .dropdown-toggle .filter-option-inner-inner .bi,
        .bootstrap-select .dropdown-menu .dropdown-item i,
        .bootstrap-select .dropdown-menu .dropdown-item .bi {
            display: inline-block !important;
            margin-right: 8px !important;
            font-size: 1.1em !important;
            vertical-align: middle !important;
        }

        .bootstrap-select .dropdown-toggle .filter-option-inner-inner {
            display: flex !important;
            align-items: center !important;
        }

        .bootstrap-select .dropdown-menu .dropdown-item {
            display: flex !important;
            align-items: center !important;
        }

        .bootstrap-select .dropdown-menu .dropdown-item .text {
            flex: 1 !important;
        }

        .dropdown-toggle .filter-option-inner-inner .bi::before,
        .dropdown-item .bi::before {
            display: inline-block !important;
        }

        .table th { white-space: nowrap; }
        .table td { vertical-align: middle !important; }

        .handleDragAndDrop { cursor: grab; }
        .handleDragAndDrop:active { cursor: grabbing; }

        .bootstrap-select .dropdown-toggle {
            background-color: transparent !important;
            border: 1px solid #dee2e6 !important;
            padding: 0.25rem 0.5rem !important;
            font-size: 0.875rem !important;
            line-height: 1.5 !important;
            border-radius: 0.2rem !important;
        }

        .bootstrap-select .dropdown-toggle:hover {
            background-color: #e9ecef !important;
        }

        .bootstrap-select .dropdown-menu {
            min-width: 200px !important;
            font-size: 0.875rem !important;
        }

        .dropdown-item[data-value="todo"] { color: #6c757d; }
        .dropdown-item[data-value="in_progress"] { color: #0d6efd; }
        .dropdown-item[data-value="done"] { color: #198754; }
        .dropdown-item[data-value="archived"] { color: #dc3545; }

        .dropdown-item[data-value="todo"] .bi { color: #6c757d; }
        .dropdown-item[data-value="in_progress"] .bi { color: #0d6efd; }
        .dropdown-item[data-value="done"] .bi { color: #198754; }
        .dropdown-item[data-value="archived"] .bi { color: #dc3545; }
    </style>
</head>
<body>

<div th:fragment="tasks-container(tasks, userId, listId)" id="tasks-container" class="mt-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">All Tasks</h2>
        <span class="badge bg-secondary rounded-pill" th:text="${#lists.size(tasks)} + ' tasks'"></span>
    </div>

    <!-- Sortable Tasks Table -->
    <div th:if="${not tasks.empty}">
        <div class="table-responsive">
            <table class="table table-hover align-middle" id="tasksTable">
                <thead class="table-light">
                <tr>
                    <th style="min-width: 140px;">Status</th>
                    <th style="min-width: 150px;">Title</th>
                    <th style="min-width: 150px;">Description</th>
                    <th style="min-width: 80px;">Priority</th>
                    <th style="min-width: 120px;">Due Date</th>
                    <th style="min-width: 200px;">Actions</th>
                </tr>
                </thead>
                <tbody>

                <th:block th:each="task : ${tasks}">

                    <th:block th:replace="~{fragments/task-item :: task-item(task=${task}, userId=${userId}, listId=${listId})}"></th:block>

                    <tr th:id="'task-edit-row-' + ${task.id}" style="display: none;">
                        <td colspan="6">
                            <div th:id="'task-edit-container-' + ${task.id}" class="edit-container">
                            </div>
                        </td>
                    </tr>

                </th:block>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${tasks.empty}" class="alert alert-info text-center py-5 my-3">
        <i class="bi bi-inbox fs-1 d-block mb-3"></i>
        <h4 class="alert-heading h5">No tasks yet</h4>
        <p class="mb-0">Create your first task using the form above!</p>
    </div>
</div>

<!-- NO SCRIPTS HERE - All scripts are in tasks.html -->

</body>
</html>
