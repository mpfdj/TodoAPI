<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS (alleen voor specifieke overschrijvingen) -->
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>

    <!-- Bootstrap Icons (optioneel, voor betere icoontjes) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:fragment="task-item(task, userId, listId)"
     th:id="'task-' + ${task.id}"
     class="card mb-3 task-item">

    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">

            <!-- Linker kant: Task info -->
            <div class="d-flex align-items-center gap-2 flex-wrap flex-grow-1">
                <!-- Checkbox -->
                <input type="checkbox"
                       class="form-check-input"
                       th:checked="${task.status == 'done' or task.status == 'archived'}"
                       th:disabled="${task.status == 'archived'}"
                       onclick="return false;"
                       onkeydown="return false;"/>

                <!-- Task Title -->
                <span th:class="(${task.status == 'archived'} ? 'text-secondary text-decoration-line-through fw-bold' : 'fw-bold')"
                      th:text="${task.title}">Task Title</span>

                <!-- Task Description -->
                <span th:if="${task.description != null and task.description != ''}"
                      class="text-secondary small"
                      th:text="'- ' + ${task.description}">- Description</span>

                <!-- Status Badges -->
                <span th:if="${task.status == 'archived'}" class="badge bg-secondary">Archived</span>
                <span th:if="${task.status == 'done'}" class="badge bg-success">Done</span>
                <span th:if="${task.status == 'in_progress'}" class="badge bg-primary">In progress</span>
                <span th:if="${task.status == 'todo'}" class="badge bg-info text-dark">Todo</span>
            </div>

            <!-- Rechter kant: Actions -->
            <div class="d-flex gap-2 align-items-center flex-shrink-0">
                <!-- HTMX Status Update -->
                <form th:hx-put="@{/ui/users/{userId}/lists/{listId}/tasks/{taskId}(userId=${userId}, listId=${listId}, taskId=${task.id})}"
                      th:hx-target="'#task-' + ${task.id}"
                      th:hx-swap="outerHTML"
                      th:hx-trigger="change"
                      class="d-inline">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <!-- Debug: Toon CSRF waarden -->
                    <!--                    <div style="background: #f0f0f0; padding: 10px; margin: 10px;">-->
                    <!--                        <h3>CSRF Debug Info:</h3>-->
                    <!--                        <p>Parameter Name: <strong th:text="${_csrf.parameterName}"></strong></p>-->
                    <!--                        <p>Token: <strong th:text="${_csrf.token}"></strong></p>-->
                    <!--                        <p>Header Name: <strong th:text="${_csrf.headerName}"></strong></p>-->
                    <!--                    </div>-->

                    <select name="status" class="form-select form-select-sm" style="width: auto;" required>
                        <option value="todo" th:selected="${task.status == 'todo'}">todo</option>
                        <option value="in_progress" th:selected="${task.status == 'in_progress'}">in_progress</option>
                        <option value="done" th:selected="${task.status == 'done'}">done</option>
                        <option value="archived" th:selected="${task.status == 'archived'}">archived</option>
                    </select>
                </form>

                <!-- Edit Task Button -->
                <button class="btn btn-sm btn-outline-primary"
                        th:hx-get="@{/ui/users/{userId}/lists/{listId}/tasks/{taskId}/edit-form(userId=${userId}, listId=${listId}, taskId=${task.id})}"
                        th:hx-target="'#task-edit-container-' + ${task.id}"
                        th:hx-swap="innerHTML"
                        hx-trigger="click">
                    <i class="bi bi-pencil"></i> Edit
                </button>

                <!-- Delete Task Form -->
                <form class="delete-form d-inline"
                      th:hx-delete="@{/ui/users/{userId}/lists/{listId}/tasks/{taskId}(userId=${userId}, listId=${listId}, taskId=${task.id})}"
                      th:hx-target="'#tasks-container'"
                      th:hx-swap="outerHTML"
                      th:hx-confirm="'Delete this task?'">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <!-- Debug: Toon CSRF waarden -->
<!--                    <div style="background: #f0f0f0; padding: 10px; margin: 10px;">-->
<!--                        <h3>CSRF Debug Info:</h3>-->
<!--                        <p>Parameter Name: <strong th:text="${_csrf.parameterName}"></strong></p>-->
<!--                        <p>Token: <strong th:text="${_csrf.token}"></strong></p>-->
<!--                        <p>Header Name: <strong th:text="${_csrf.headerName}"></strong></p>-->
<!--                    </div>-->

                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Form Container (hidden by default) -->
    <div th:id="'task-edit-container-' + ${task.id}" class="edit-form-container hidden border-top pt-3 mt-2"></div>

</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
