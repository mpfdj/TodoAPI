<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        /* Status color classes for Selectpicker button */
        .btn.dropdown-toggle.status-todo { color: #6c757d !important; border-color: #6c757d !important; }
        .btn.dropdown-toggle.status-in_progress { color: #0d6efd !important; border-color: #0d6efd !important; }
        .btn.dropdown-toggle.status-done { color: #198754 !important; border-color: #198754 !important; }
        .btn.dropdown-toggle.status-archived { color: #dc3545 !important; border-color: #dc3545 !important; }

        /* Override Bootstrap Select default styles */
        .bootstrap-select .dropdown-toggle.btn-light {
            background-color: #f8f9fa !important;
            border: 1px solid #dee2e6 !important;
        }
        .bootstrap-select .dropdown-toggle.btn-light:hover {
            background-color: #e9ecef !important;
        }
    </style>
</head>
<body>

<tr th:fragment="task-item(task, userId, listId)"
    th:id="'task-' + ${task.id}"
    class='handleDragAndDrop'>

    <script>
        function handleClick(element) {
            const taskId = element.dataset.taskId;
            const userId = element.dataset.userId;
            const listId = element.dataset.listId;
            const taskTitle = element.dataset.taskTitle;
            const taskStatus = element.dataset.taskStatus;

            console.log('Task ID:', taskId);
            console.log('User ID:', userId);
            console.log('List ID:', listId);
            console.log('Title:', taskTitle);
            console.log('Status:', taskStatus);
        }

        function toggleEdit(button) {
            const taskId = button.getAttribute('data-task-id');
            const editUrl = button.getAttribute('data-edit-url');
            const targetRow = document.getElementById('task-edit-row-' + taskId);
            const icon = button.querySelector('i');
            const containerId = 'task-edit-container-' + taskId;

            if (button.getAttribute('data-state') === 'open') {
                if (targetRow) targetRow.style.display = 'none';
                button.setAttribute('data-state', 'closed');
                icon.classList.remove('bi-x-circle');
                icon.classList.add('bi-pencil');
            } else {
                if (targetRow) {
                    targetRow.style.display = 'table-row';
                    htmx.ajax('GET', editUrl, {
                        target: '#' + containerId,
                        swap: 'innerHTML'
                    });
                }
                button.setAttribute('data-state', 'open');
                icon.classList.remove('bi-pencil');
                icon.classList.add('bi-x-circle');
            }
        }

        // Function to sync status class from select to button
        function syncSelectpickerStatusClass(selectElement) {
            if (!selectElement) return;
            const status = selectElement.value;
            const $button = $(selectElement).closest('.bootstrap-select').find('.dropdown-toggle');
            $button.removeClass('status-todo status-in_progress status-done status-archived');
            if (status) {
                $button.addClass('status-' + status);
            }
            console.log('Status class synced:', status, 'Button classes:', $button.attr('class'));
        }

        // Function to initialize a single selectpicker
        function initSelectpicker(selectElement) {
            if (!selectElement) return;
            const $select = $(selectElement);

            // Check if already initialized
            if ($select.data('selectpicker')) {
                $select.selectpicker('destroy');
            }

            // Initialize with custom style
            $select.selectpicker({
                style: 'btn-light',
                size: false,
                liveSearch: false
            });

            // Fix button classes
            const $button = $select.closest('.bootstrap-select').find('.dropdown-toggle');
            console.log($button);
            $button.removeClass();
            $button.addClass('btn dropdown-toggle btn-sm btn-outline-secondary');

            // Sync status class
            syncSelectpickerStatusClass(selectElement);

            console.log('Selectpicker initialized:', $select.attr('id'));
        }

        // Function to initialize all selectpickers in a container
        function initAllSelectpickers(container) {
            if (typeof $ === 'undefined' || !$.fn.selectpicker) return;

            const target = container || document;
            $(target).find('select.selectpicker.status-select').each(function() {
                initSelectpicker(this);
            });
        }

        // Make functions globally available
        window.initAllSelectpickers = initAllSelectpickers;
        window.syncSelectpickerStatusClass = syncSelectpickerStatusClass;
    </script>

    <script>
        // HTMX event listener for task updates
        document.body.addEventListener('htmx:afterSwap', function(event) {
            // Handle status container updates
            if (event.detail.target && event.detail.target.id && event.detail.target.id.startsWith('status-container-')) {
                // Reinitialize the selectpicker in the updated container
                setTimeout(function() {
                    const selectElement = event.detail.target.querySelector('select.selectpicker');
                    if (selectElement) {
                        initSelectpicker(selectElement);
                    }
                }, 50);
            }

            // Handle task updates (close edit form)
            if (event.detail.target && event.detail.target.id && event.detail.target.id.startsWith('task-')) {
                const taskId = event.detail.target.id.replace('task-', '');
                setTimeout(function() {
                    const editRow = document.getElementById('task-edit-row-' + taskId);
                    const editBtn = document.getElementById('edit-btn-' + taskId);
                    if(editRow) editRow.style.display = 'none';
                    if(editBtn) {
                        editBtn.setAttribute('data-state', 'closed');
                        const icon = editBtn.querySelector('i');
                        if(icon) {
                            icon.classList.remove('bi-x-circle');
                            icon.classList.add('bi-pencil');
                        }
                    }
                }, 100);
            }

            // Handle edit container updates (when edit form is loaded)
            if (event.detail.target && event.detail.target.id && event.detail.target.id.startsWith('task-edit-container-')) {
                setTimeout(function() {
                    initAllSelectpickers(event.detail.target);
                }, 100);
            }
        });

        // Also handle after settle for any other swaps
        document.body.addEventListener('htmx:afterSettle', function(event) {
            if (event.detail.target) {
                setTimeout(function() {
                    initAllSelectpickers(event.detail.target);
                }, 100);
            }
        });

        // Handle change event on select - using jQuery's change event
        // This is crucial for Bootstrap Select to trigger HTMX
        if (typeof $ !== 'undefined') {
            $(document).on('changed.bs.select', 'select.selectpicker.status-select', function(e, clickedIndex, newValue, oldValue) {
                // Trigger the change event on the original select element
                // This will trigger HTMX's hx-trigger="change"
                $(this).trigger('change');
                
                // Update the status class on the button
                syncSelectpickerStatusClass(this);

                // Also ensure the button has the right classes
                const $button = $(this).closest('.bootstrap-select').find('.dropdown-toggle');
                $button.removeClass();
                $button.addClass('btn dropdown-toggle btn-sm btn-outline-secondary');
            });
        }

        // Initialize on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                initAllSelectpickers(document);
            });
        } else {
            initAllSelectpickers(document);
        }

        console.log('Task item loaded successfully');
    </script>

    <!-- Status cell -->
    <td th:id="'status-container-' + ${task.id}">
        <form th:hx-put="@{/ui/users/{userId}/lists/{listId}/tasks/{taskId}(userId=${userId}, listId=${listId}, taskId=${task.id}, source='task-item')}"
              th:hx-target="'#status-container-' + ${task.id}"
              th:hx-swap="outerHTML"
              th:hx-trigger="change"
              class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <select name="status"
                    th:id="'status-select-' + ${task.id}"
                    th:data-task-id="${task.id}"
                    class="selectpicker status-select"
                    th:data-original-value="${task.status}"
                    data-live-search="false"
                    data-size="5"
                    style="width: auto;">
                <option value="todo" th:selected="${task.status == 'todo'}" data-icon="bi-clipboard">Todo</option>
                <option value="in_progress" th:selected="${task.status == 'in_progress'}" data-icon="bi-hourglass-split">In Progress</option>
                <option value="done" th:selected="${task.status == 'done'}" data-icon="bi-check-circle">Done</option>
                <option value="archived" th:selected="${task.status == 'archived'}" data-icon="bi-archive">Archived</option>
            </select>
        </form>
    </td>

    <!-- Title cell -->
    <td th:id="'title-container-' + ${task.id}">
        <span th:class="(${task.status == 'archived'} ? 'text-secondary text-decoration-line-through fw-bold' : 'fw-bold')"
              th:text="${task.title}">Task Title</span>
    </td>

    <!-- Description cell -->
    <td th:title="${task.description}">
        <span th:if="${task.description != null and task.description.length() > 80}"
              th:text="${#strings.substring(task.description, 0, 80)} + '...'"></span>
        <span th:unless="${task.description != null and task.description.length() > 80}"
              th:text="${task.description}"></span>
    </td>

    <!-- Priority cell -->
    <td>
        <span class="text-secondary small" th:text="${task.priority}"></span>
    </td>

    <!-- Due Date cell -->
    <td>
        <span class="text-secondary small" th:text="${task.dueDate}"></span>
    </td>

    <!-- Actions cell -->
    <td>
        <div class="d-flex gap-2 align-items-center flex-shrink-0">
            <button class="btn btn-sm btn-outline-primary"
                    th:id="'edit-btn-' + ${task.id}"
                    th:data-task-id="${task.id}"
                    th:data-edit-url="@{/ui/users/{userId}/lists/{listId}/tasks/{taskId}/edit-form(userId=${userId}, listId=${listId}, taskId=${task.id})}"
                    th:data-state="closed"
                    th:onclick="toggleEdit(this)">
                <i class="bi bi-pencil"></i> Edit
            </button>

            <form class="delete-form d-inline"
                  th:hx-delete="@{/ui/users/{userId}/lists/{listId}/tasks/{taskId}(userId=${userId}, listId=${listId}, taskId=${task.id})}"
                  th:hx-target="'#tasks-container'"
                  th:hx-swap="outerHTML"
                  th:hx-confirm="'Delete this task?'">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-trash"></i> Delete
                </button>
            </form>

            <button class="btn btn-sm btn-outline-info"
                    th:data-task-id="${task.id}"
                    th:data-user-id="${userId}"
                    th:data-list-id="${listId}"
                    th:data-task-title="${task.title}"
                    th:data-task-status="${task.status}"
                    th:onclick="handleClick(this)">
                <i class="bi bi-info-circle"></i> Info
            </button>
        </div>
    </td>
</tr>

<!-- Status update fragment -->
<th:block th:fragment="statusUpdate">
    <td th:id="'status-container-' + ${task.id}">
        <form th:hx-put="@{/ui/users/{userId}/lists/{listId}/tasks/{taskId}(userId=${userId}, listId=${listId}, taskId=${task.id}, source='task-item')}"
              th:hx-target="'#status-container-' + ${task.id}"
              th:hx-swap="outerHTML"
              th:hx-trigger="change"
              class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <select name="status"
                    th:id="'status-select-' + ${task.id}"
                    th:data-task-id="${task.id}"
                    class="selectpicker status-select"
                    th:data-original-value="${task.status}"
                    data-live-search="false"
                    data-size="5"
                    style="width: auto;">
                <option value="todo" th:selected="${task.status == 'todo'}" data-icon="bi-clipboard">Todo</option>
                <option value="in_progress" th:selected="${task.status == 'in_progress'}" data-icon="bi-hourglass-split">In Progress</option>
                <option value="done" th:selected="${task.status == 'done'}" data-icon="bi-check-circle">Done</option>
                <option value="archived" th:selected="${task.status == 'archived'}" data-icon="bi-archive">Archived</option>
            </select>
        </form>
    </td>
</th:block>

<!-- Title update fragment (OOB) -->
<th:block th:fragment="titleUpdate">
    <td th:id="'title-container-' + ${task.id}"
        th:hx-swap-oob="innerHTML">
        <span th:class="(${task.status == 'archived'} ? 'text-secondary text-decoration-line-through fw-bold' : 'fw-bold')"
              th:text="${task.title}">Task Title</span>
    </td>
</th:block>

<!-- Both updates together -->
<th:block th:fragment="updateStatusAndTitle">
    <th:block th:replace="~{fragments/task-item :: statusUpdate}"></th:block>
    <th:block th:replace="~{fragments/task-item :: titleUpdate}"></th:block>
</th:block>

</body>
</html>
