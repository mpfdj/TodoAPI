<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml">
<head>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
<div th:fragment="task-item(task, userId, listId)" th:id="'task-' + ${task.id}" class="task-item">
    <div class="task-info">
        <!-- Task Title -->
        <span th:class="(${task.status == 'archived'} ? 'task-name-archived' : 'task-name')"
              th:text="${task.title}">Task Title</span>

        <!-- Task Description -->
        <span th:if="${task.description != null and task.description != ''}"
              class="task-description"
              th:text="'- ' + ${task.description}">- Description</span>

        <!-- Status Badge -->
        <span th:if="${task.status == 'archived'}" class="archived-badge">Archived</span>
        <span th:if="${task.status == 'done'}" class="done-badge">Done</span>
        <span th:if="${task.status == 'in_progress'}" class="in_progress-badge">In progress</span>
        <span th:if="${task.status == 'todo'}" class="todo-badge">Todo</span>
    </div>

    <div class="task-actions">
        <!-- HTMX Status Update Form -->
        <form th:action="@{'/ui/users/' + ${userId} + '/lists/' + ${listId} + '/tasks/' + ${task.id} + '/toggle'}"
              method="post"
              style="display: inline;"
              hx-post
              hx-target="#task-${task.id}"
              hx-swap="outerHTML"
              hx-trigger="change">
            <input type="hidden" name="_method" value="PUT" />
            <select name="status" required>
                <option value="todo" th:selected="${task.status == 'todo'}">todo</option>
                <option value="in_progress" th:selected="${task.status == 'in_progress'}">in_progress</option>
                <option value="done" th:selected="${task.status == 'done'}">done</option>
                <option value="archived" th:selected="${task.status == 'archived'}">archived</option>
            </select>
        </form>

        <!-- Edit Task -->
        <a th:href="@{'/ui/users/' + ${userId} + '/lists/' + ${listId} + '/tasks/' + ${task.id} + '/edit'}">Edit</a>

        <!-- Delete Task -->
        <form class="delete-form"
              th:action="@{'/ui/users/' + ${userId} + '/lists/' + ${listId} + '/tasks/' + ${task.id}}"
              method="post"
              style="display: inline;"
              hx-post
              hx-target="#task-${task.id}"
              hx-swap="outerHTML"
              hx-confirm="Delete this task?">
            <input type="hidden" name="_method" value="DELETE" />
            <button type="submit">Delete</button>
        </form>




        <!-- Test -->
        <form th:action="@{'/ui/users/' + ${userId} + '/lists/' + ${listId} + '/tasks/' + ${task.id} + '/toggle'}"
              method="post"
              style="display: inline;"
              hx-post
              hx-target="#task-${task.id}"
              hx-swap="outerHTML"
              hx-trigger="change from:select"
              hx-headers='{"X-Test": "true"}'
              hx-on::after-request="console.log('HTMX request completed')">
            <input type="hidden" name="_method" value="PUT" />
            <select name="status" required>
                <option value="todo" th:selected="${task.status == 'todo'}">todo</option>
                <option value="in_progress" th:selected="${task.status == 'in_progress'}">in_progress</option>
                <option value="done" th:selected="${task.status == 'done'}">done</option>
                <option value="archived" th:selected="${task.status == 'archived'}">archived</option>
            </select>
            <button type="submit">TEST</button>
        </form>

        <form th:action="@{'/ui/users/' + ${userId} + '/lists/' + ${listId} + '/tasks/' + ${task.id} + '/toggle'}"
              method="post"
              style="display: inline;"
              hx-post
              hx-target="#task-${task.id}"
              hx-swap="outerHTML"
              hx-trigger="change"
              hx-on::after-request="console.log('Request completed')"
              hx-on::before-request="console.log('Request starting')">
            <input type="hidden" name="_method" value="PUT" />
<!--            <select name="status" required onchange="console.log('Change event fired')">-->
            <select name="status" required onchange="this.form.submit()">
                <option value="todo" th:selected="${task.status == 'todo'}">todo</option>
                <option value="in_progress" th:selected="${task.status == 'in_progress'}">in_progress</option>
                <option value="done" th:selected="${task.status == 'done'}">done</option>
                <option value="archived" th:selected="${task.status == 'archived'}">archived</option>
            </select>
        </form>
    </div>
</div>
</body>
</html>
