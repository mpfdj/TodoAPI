<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lists</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}" />  <!-- In users.html, lists.html, tasks.html, etc. -->
    <link rel="stylesheet" href="/css/style.css" />        <!-- or for static HTML -->
</head>
<body>

<!-- DEBUG -->
<div th:replace="~{fragments/debug :: debug}"></div>

<h1>Todo Lists for User: <span th:text="${name}"/></h1>

<!-- Back to Users -->
<p>
    <a th:href="@{/ui/users(userId=${userId})}">← Back to Users</a>
</p>

<hr/>

<!-- Create List -->
<form th:action="@{/ui/users/{userId}/lists(userId=${userId})}" method="post">
    <input type="text" name="name" placeholder="Enter list name" required />
    <input type="text" name="description" placeholder="Enter description" required />
    <button type="submit">Add List</button>
</form>

<hr/>

<!-- Lists -->
<h2>All Lists</h2>
<ul>
    <li th:each="list : ${lists}">
        <div class="list-info">
            <span class="list-name" th:text="${list.name}">List Name</span>
        </div>

        <!-- View Tasks -->
        <a th:href="@{/ui/users/{userId}/lists/{listId}/tasks(userId=${userId}, listId=${list.id})}">View Tasks</a>

        <!-- Delete List -->
        <form class="delete-form" th:action="@{/ui/users/{userId}/lists/{listId}(userId=${userId}, listId=${list.id})}" method="post">
            <input type="hidden" name="_method" value="DELETE" />
            <button type="submit" onclick="return confirm('Delete this list and all its tasks?')">Delete</button>
        </form>
    </li>
</ul>

<!-- Message when no lists exist -->
<div th:if="${lists.empty}" style="color: #666; font-style: italic; margin-top: 20px;">
    No lists yet. Create your first list above!
</div>

</body>
</html>
