<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lists</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS voor specifieke aanpassingen (optioneel) -->
    <link rel="stylesheet" th:href="@{/css/custom.css}" />
</head>
<body class="container py-4">

<!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="display-5 fw-bold text-primary">
        Todo Lists for User: <span th:text="${name}" class="text-secondary"></span>
    </h1>

    <!-- Back to Users -->
    <a th:href="@{/ui/users(userId=${userId})}" class="btn btn-outline-secondary">
        ← Back to Users
    </a>
</div>

<hr class="my-4">

<!-- Create List Form -->
<div class="card mb-4 shadow-sm">
    <div class="card-header bg-primary text-white">
        <h2 class="h5 mb-0">Create New List</h2>
    </div>
    <div class="card-body">
        <form th:action="@{/ui/users/{userId}/lists(userId=${userId})}" method="post" class="row g-3">
            <div class="col-md-5">
                <input type="text"
                       class="form-control"
                       name="name"
                       placeholder="Enter list name"
                       required />
            </div>
            <div class="col-md-5">
                <input type="text"
                       class="form-control"
                       name="description"
                       placeholder="Enter description"
                       required />
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    Add List
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Lists Section -->
<div class="card shadow-sm">
    <div class="card-header bg-secondary text-white">
        <h2 class="h5 mb-0">All Lists</h2>
    </div>
    <div class="card-body p-0">
        <!-- Message when no lists exist -->
        <div th:if="${lists.empty}" class="alert alert-info m-3">
            <i class="bi bi-folder2-open"></i> No lists yet. Create your first list above!
        </div>

        <!-- Lists List -->
        <ul class="list-group list-group-flush" th:unless="${lists.empty}">
            <li th:each="list : ${lists}" class="list-group-item">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="list-info">
                        <span class="fw-bold list-name" th:text="${list.name}">List Name</span>
                        <span class="text-secondary small ms-2" th:text="${list.description}" th:if="${list.description}"></span>
                    </div>
                    <div class="d-flex gap-2 align-items-center flex-shrink-0" role="group" >

                    <!-- View Tasks -->
                        <a th:href="@{/ui/users/{userId}/lists/{listId}/tasks(userId=${userId}, listId=${list.id})}"
                           class="btn btn-sm btn-outline-primary">
                            View Tasks
                        </a>

                        <!-- Delete List -->
                        <form class="d-inline"
                              th:action="@{/ui/users/{userId}/lists/{listId}(userId=${userId}, listId=${list.id})}"
                              method="post">
                            <input type="hidden" name="_method" value="DELETE" />
                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Delete this list and all its tasks?')">
                                Delete
                            </button>
                        </form>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</div>

<!-- DEBUG -->
<div th:replace="~{fragments/debug :: debug}"></div>

<!-- Bootstrap Icons (optioneel) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Bootstrap JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
