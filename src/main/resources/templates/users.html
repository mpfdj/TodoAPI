<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Users</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS voor specifieke aanpassingen (optioneel) -->
    <link rel="stylesheet" th:href="@{/css/custom.css}" />
</head>
<body class="container py-4">

<!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="display-5 fw-bold text-primary">User Management</h1>

    <!-- Back to Lists Link -->
    <a th:if="${userId != null}"
       th:href="@{/ui/users/{userId}/lists(userId=${userId})}"
       class="btn btn-outline-secondary">
        ← Back to Lists
    </a>
</div>

<hr class="my-4">

<!-- Create User Form -->
<div class="card mb-4">
    <div class="card-header bg-primary text-white">
        <h2 class="h5 mb-0">Add New User</h2>
    </div>
    <div class="card-body">
        <form th:action="@{/ui/users}" method="post" class="row g-3">
            <div class="col-md-4">
                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       placeholder="Enter email address"
                       required />
            </div>

            <div class="col-md-3">
                <input type="text"
                       class="form-control"
                       id="name"
                       name="name"
                       placeholder="Enter user name"
                       required />
            </div>
            <div class="col-md-3">
                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="Enter password"
                       required />
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    Add User
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Users List -->
<div class="card">
    <div class="card-header bg-secondary text-white">
        <h2 class="h5 mb-0">All Users</h2>
    </div>
    <div class="card-body p-0">
        <div th:if="${users.empty}" class="alert alert-info m-3">
            No users yet. Create your first user above!
        </div>
        <ul class="list-group list-group-flush" th:unless="${users.empty}">
            <li th:each="user : ${users}" class="list-group-item d-flex justify-content-between align-items-center">
                <div class="user-info">
                    <span class="fw-bold user-name" th:text="${user.name}">User Name</span>
                    <span class="text-secondary small user-email ms-2" th:text="|(${user.email})|">(user@example.com)</span>
                </div>

                <div class="d-flex gap-2 align-items-center flex-shrink-0" role="group" >

                    <!-- View Lists for this user -->
                    <a th:href="@{/ui/users/{userId}/lists(userId=${user.id})}"
                       class="btn btn-sm btn-outline-primary">
                        View Lists
                    </a>

                    <!-- Delete Individual User -->
                    <form class="delete-form d-inline"
                          th:action="@{/ui/users/{userId}(userId=${user.id})}"
                          method="post">
                        <input type="hidden" name="_method" value="DELETE" />
                        <button type="submit"
                                class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Delete this user and all their lists?')">
                            Delete
                        </button>
                    </form>
                </div>
            </li>
        </ul>
    </div>
</div>

<!-- DEBUG - Blijft zoals het was -->
<div th:replace="~{fragments/debug :: debug}"></div>

<!-- Bootstrap Icons (optioneel, voor de icoontjes) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Bootstrap JavaScript Bundle (voor interactieve componenten) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
