<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Users</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}" />  <!-- In users.html, lists.html, tasks.html, etc. -->
    <link rel="stylesheet" href="/static/css/style.css" />        <!-- or for static HTML -->
</head>
<body>

<!-- DEBUG -->
<div th:replace="~{fragments/debug :: debug}"></div>

<h1>User Management</h1>

<!-- Back to Lists -->
<p>
    <a th:if="${userId != null}" th:href="@{/ui/users/{userId}/lists(userId=${userId})}">← Back to Lists</a>
</p>

<hr/>

<!-- Create User Form -->
<form th:action="@{/ui/users}" method="post">
    <input type="email" name="email" placeholder="Enter email address" required />
    <input type="text" name="name" placeholder="Enter user name" required />
    <input type="password" name="password" placeholder="Enter password" required />
    <button type="submit">Add User</button>
</form>

<hr/>

<!-- Users List -->
<h2>All Users</h2>
<ul>
    <li th:each="user : ${users}">
        <div class="user-info">
            <span class="user-name" th:text="${user.name}">User Name</span>
            <span class="user-email" th:text="|(${user.email})|">(user@example.com)</span>
        </div>

        <!-- View Lists for this user -->
        <a th:href="@{/ui/users/{userId}/lists(userId=${user.id})}">View Lists</a>

        <!-- Delete Individual User -->
        <form class="delete-form" th:action="@{/ui/users/{userId}(userId=${user.id})}" method="post">
            <input type="hidden" name="_method" value="DELETE" />
            <button type="submit" onclick="return confirm('Delete this user and all their lists?')">Delete</button>
        </form>
    </li>
</ul>

</body>
</html>
