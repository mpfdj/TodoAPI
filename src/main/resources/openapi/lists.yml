paths:
  /users/{userId}/lists:
    get:
      tags:
        - Lists
      summary: List all lists for a user
      description: Returns all lists that belong to the given user.
      operationId: getLists
      parameters:
        - name: userId
          in: path
          description: Owner user id
          required: true
          schema:
            type: integer
            format: int64
            example: 42
      responses:
        '200':
          description: Lists found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/schemas.yml#/ListDTO'
        '404':
          description: No lists found for the user
          content: {}

    post:
      tags:
        - Lists
      summary: Create a list for a user
      description: Creates a new list for the specified user.
      operationId: createList
      parameters:
        - name: userId
          in: path
          description: Owner user id
          required: true
          schema:
            type: integer
            format: int64
            example: 42
      requestBody:
        required: true
        description: List details
        content:
          application/json:
            schema:
              $ref: './components/schemas.yml#/CreateListRequestDTO'
      responses:
        '201':
          description: List created
          headers:
            Location:
              description: URI of the created list resource
              schema:
                type: string
                format: uri
                example: /users/42/lists/1001
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ListDTO'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'
        '404':
          description: Owner user not found
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'
        '409':
          description: Duplicate list name for this user
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'

  /users/{userId}/lists/{listId}:
    get:
      tags:
        - Lists
      summary: Get a list by id
      description: Returns a specific list for the given user.
      operationId: getList
      parameters:
        - name: userId
          in: path
          description: Owner user id
          required: true
          schema:
            type: integer
            format: int64
            example: 42
        - name: listId
          in: path
          description: List id
          required: true
          schema:
            type: integer
            format: int64
            example: 1001
      responses:
        '200':
          description: List found
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ListDTO'
        '404':
          description: List not found for the given user
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'

    put:
      tags:
        - Lists
      summary: Update a list
      description: Updates an existing list for the given user.
      operationId: updateList
      parameters:
        - name: userId
          in: path
          description: Owner user id
          required: true
          schema:
            type: integer
            format: int64
            example: 42
        - name: listId
          in: path
          description: List id
          required: true
          schema:
            type: integer
            format: int64
            example: 1001
      requestBody:
        required: true
        description: Updated list values
        content:
          application/json:
            schema:
              $ref: './components/schemas.yml#/UpdateListRequestDTO'
      responses:
        '200':
          description: List updated
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ListDTO'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'
        '404':
          description: List not found for the given user
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'

    delete:
      tags:
        - Lists
      summary: Delete a list
      description: Deletes a list by id for the given user.
      operationId: deleteList
      parameters:
        - name: userId
          in: path
          description: Owner user id
          required: true
          schema:
            type: integer
            format: int64
            example: 42
        - name: listId
          in: path
          description: List id
          required: true
          schema:
            type: integer
            format: int64
            example: 1001
      responses:
        '204':
          description: Deleted
        '404':
          description: List not found for the given user
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'