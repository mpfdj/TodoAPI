paths:
  /users:
    get:
      tags:
        - Users
      summary: List users
      description: Returns all users. Responds with **404** if no users are present.
      operationId: getUsers
      responses:
        '200':
          description: Users found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/schemas.yml#/UserDTO'
        '404':
          description: No users found
          content: {}

    post:
      tags:
        - Users
      summary: Create a user
      description: Creates a new user and returns it. Responds with **409** if the email already exists.
      operationId: createUser
      requestBody:
        required: true
        description: User details
        content:
          application/json:
            schema:
              $ref: './components/schemas.yml#/CreateUserRequestDTO'
      responses:
        '201':
          description: User created
          headers:
            Location:
              description: URI of the created user resource
              schema:
                type: string
                example: /users/123
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/UserDTO'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'
        '409':
          description: Duplicate email
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'

    delete:
      tags:
        - Users
      summary: Delete user by email
      description: Deletes a user by email.
      operationId: deleteUserByEmail
      parameters:
        - name: email
          in: query
          description: Email address of the user to delete
          required: true
          schema:
            type: string
            example: jane.doe@example.com
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid email format
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'

  /users/{userId}:
    get:
      tags:
        - Users
      summary: Get user by id
      description: Returns a user by its id.
      operationId: getUser
      parameters:
        - name: userId
          in: path
          description: Numeric identifier of the user
          required: true
          schema:
            type: integer
            format: int64
            example: 123
      responses:
        '200':
          description: User found
          headers:
            Location:
              description: URI of the user resource
              schema:
                type: string
                example: /users/123
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/UserDTO'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'

    put:
      tags:
        - Users
      summary: Update a user
      description: Updates an existing user and returns it.
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          description: Numeric identifier of the user to update
          required: true
          schema:
            type: integer
            format: int64
            example: 123
      requestBody:
        required: true
        description: Updated user values
        content:
          application/json:
            schema:
              $ref: './components/schemas.yml#/UpdateUserRequestDTO'
      responses:
        '200':
          description: User updated
          headers:
            Location:
              description: URI of the updated user resource
              schema:
                type: string
                example: /users/123
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/UserDTO'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'
        '409':
          description: Duplicate email
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'

    delete:
      tags:
        - Users
      summary: Delete user by id
      description: Deletes a user by its id.
      operationId: deleteUserById
      parameters:
        - name: userId
          in: path
          description: Numeric identifier of the user
          required: true
          schema:
            type: integer
            format: int64
            example: 123
      responses:
        '204':
          description: Deleted
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: './components/schemas.yml#/ErrorDTO'