# User Schemas
UserDTO:
  type: object
  properties:
    id:
      type: integer
      format: int64
      description: Unique identifier of the user
      example: 123
    name:
      type: string
      description: Full name of the user
      example: John Doe
    email:
      type: string
      format: email
      description: Email address of the user
      example: john.doe@example.com
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the user was created
    updatedAt:
      type: string
      format: date-time
      description: Timestamp when the user was last updated

CreateUserRequestDTO:
  type: object
  required:
    - name
    - email
    - password
  properties:
    name:
      type: string
      description: Full name of the user
      example: John Doe
    email:
      type: string
      format: email
      description: Email address of the user (must be unique)
      example: john.doe@example.com
    password:
      type: string
      format: password
      description: Password for the user account
      example: P@ssw0rd123

UpdateUserRequestDTO:
  type: object
  properties:
    name:
      type: string
      description: Updated full name of the user
      example: Johnathan Doe
    email:
      type: string
      format: email
      description: Updated email address (must be unique)
      example: johnathan.doe@example.com
    password:
      type: string
      format: password
      description: Updated password
      example: NewP@ssw0rd456

# List Schemas
ListDTO:
  type: object
  properties:
    id:
      type: integer
      format: int64
      description: Unique identifier of the list
      example: 1001
    name:
      type: string
      description: Name of the todo list
      example: Work Tasks
    description:
      type: string
      description: Optional description of the list
      example: Tasks related to my job
    userId:
      type: integer
      format: int64
      description: ID of the user who owns this list
      example: 42
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the list was created
      example: "2024-01-15T10:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: Timestamp when the list was last updated
      example: "2024-01-15T10:00:00Z"

CreateListRequestDTO:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      description: Name of the todo list
      minLength: 1
      maxLength: 100
      example: Shopping List
    description:
      type: string
      description: Optional description
      maxLength: 500
      example: Items to buy from the supermarket

UpdateListRequestDTO:
  type: object
  properties:
    name:
      type: string
      description: Updated list name
      minLength: 1
      maxLength: 100
      example: Weekend Shopping
    description:
      type: string
      description: Updated description
      maxLength: 500
      example: Grocery items for the weekend

# Task Schemas
# Task Schemas (add to your existing schemas.yml)
TaskDTO:
  type: object
  properties:
    id:
      type: integer
      format: int64
      description: Unique identifier of the task
      example: 555
    title:
      type: string
      description: Task title
      example: Complete project documentation
    description:
      type: string
      description: Detailed task description
      example: Write API documentation for all endpoints
    status:
      type: string
      enum: [todo, in_progress, done, archived]
      description: Current status of the task
      example: in_progress
    dueDate:
      type: string
      format: date
      description: Due date for the task (YYYY-MM-DD)
      example: "2024-12-31"
    priority:
      type: integer
      minimum: 1
      maximum: 5
      description: Priority level (1=lowest, 5=highest)
      example: 5
    listId:
      type: integer
      format: int64
      description: ID of the list containing this task
      example: 1001
    userId:
      type: integer
      format: int64
      description: ID of the user who owns this task
      example: 42
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the task was created
      example: "2024-01-15T10:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: Timestamp when the task was last updated
      example: "2024-01-15T10:00:00Z"

CreateTaskRequestDTO:
  type: object
  required:
    - title
    - dueDate
    - priority
  properties:
    title:
      type: string
      description: Task title
      minLength: 1
      maxLength: 200
      example: Complete project documentation
    description:
      type: string
      description: Optional task description
      maxLength: 1000
      example: Write API documentation for all endpoints
    dueDate:
      type: string
      format: date
      description: Due date for the task (YYYY-MM-DD)
      example: "2024-12-31"
    priority:
      type: integer
      minimum: 1
      maximum: 5
      description: Priority level (1=lowest, 5=highest)
      example: 5

UpdateTaskRequestDTO:
  type: object
  properties:
    title:
      type: string
      description: Updated task title
      minLength: 1
      maxLength: 200
      example: Complete project documentation and tests
    description:
      type: string
      description: Updated description
      maxLength: 1000
      example: Write API documentation and examples
    status:
      type: string
      enum: [todo, in_progress, done, archived]
      description: Updated status
      example: in_progress
    dueDate:
      type: string
      format: date
      description: Updated due date
      example: "2024-12-25"
    priority:
      type: integer
      minimum: 1
      maximum: 5
      description: Updated priority
      example: 4

# Error Schema
ErrorDTO:
  type: object
  properties:
    message:
      type: string
      description: Error message describing what went wrong
      example: User with email john.doe@example.com already exists
    timestamp:
      type: string
      format: date-time
      description: Timestamp when the error occurred
    status:
      type: integer
      description: HTTP status code
      example: 409