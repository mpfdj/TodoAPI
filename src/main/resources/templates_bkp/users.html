<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Users</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 10px 0; padding: 10px; background-color: #f5f5f5; border-radius: 5px; }
        button { margin-left: 10px; }
        a { margin-left: 10px; text-decoration: none; color: #0066cc; }
        a:hover { text-decoration: underline; }
        .user-info { display: inline-block; margin-right: 20px; }
        .user-name { font-weight: bold; }
        .user-email { color: #666; font-size: 0.9em; }
        hr { margin: 20px 0; }
        input[type="text"], input[type="email"] { padding: 5px; margin-right: 10px; width: 200px; }
        form { display: inline-block; margin-right: 10px; }
        .delete-form { display: inline; }
    </style>
</head>
<body>

<h1>User Management</h1>

<!-- Create User Form -->
<form th:action="@{/ui/users}" method="post">
    <input type="email" name="email" placeholder="Enter email address" required />
    <input type="text" name="name" placeholder="Enter user name" required />
    <input type="password" name="password" placeholder="Enter password" required />
    <button type="submit">Add User</button>
</form>

<hr/>

<!-- Users List -->
<h2>All Users</h2>
<ul>
    <li th:each="user : ${users}">
        <div class="user-info">
            <span class="user-name" th:text="${user.name}">User Name</span>
            <span class="user-email" th:text="|(${user.email})|">(user@example.com)</span>
        </div>

        <!-- View Lists for this user -->
        <a th:href="@{/ui/users/{userId}/lists(userId=${user.id})}">View Lists</a>

        <!-- Delete Individual User -->
        <form class="delete-form" th:action="@{/ui/users/{userId}(userId=${user.id})}" method="post">
            <input type="hidden" name="_method" value="DELETE" />
            <button type="submit" onclick="return confirm('Delete this user and all their lists?')">Delete</button>
        </form>
    </li>
</ul>

<hr/>

<!-- Back to Lists (if coming from a list page) -->
<div style="margin-top: 30px;">
    <a th:if="${previousListId != null}" th:href="@{/ui/users/{userId}/lists/{listId}/tasks(userId=${userId}, listId=${previousListId})}">← Back to Tasks</a>
</div>

</body>
</html>
