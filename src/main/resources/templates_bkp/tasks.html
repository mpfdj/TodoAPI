<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tasks</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 10px 0; }
        button { margin-left: 10px; }
        a { margin-right: 10px; }
    </style>
</head>
<body>

<h1>Tasks</h1>

<!-- Navigation -->
<p>
    <a th:href="@{'/ui/users/' + ${userId} + '/ate Task -->
<form th:action="@{'/ui/users/' + ${userId} + '/lists/' + ${listId} required />
    <button type="submit">Add Task</button>
    </form>

<hr/>

<!-- Task List -->
<ul>
    <li th:each="task : ${tasks}">

        <!-- Task Name -->
        <span th:text="${task.name}">Task Name</span>

        <!-- Delete Task -->
        <form th:action="@{'/ui/users/' + ${userId} + '/lists/' + ${listId} + '/tasks/delete'}">
        <button type="submit">Delete</button>
        </form>

    </li>
</ul>

</body>
</html>
